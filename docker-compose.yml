services:
  sam3d-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: sam3d-objects:dev
    container_name: sam3d-dev
    
    # Enable GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Shared memory size for PyTorch
    shm_size: '16gb'
    
    # Environment variables
    environment:
      - PIP_EXTRA_INDEX_URL=https://pypi.ngc.nvidia.com https://download.pytorch.org/whl/cu121
      - PIP_FIND_LINKS=https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.5.1_cu121.html
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    # Mount workspace
    volumes:
      - .:/workspace
      - sam3d-cache:/root/.cache
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Working directory
    working_dir: /workspace
    
    # Default command
    command: mamba run --no-capture-output -n sam3d-objects /bin/bash

volumes:
  sam3d-cache:
